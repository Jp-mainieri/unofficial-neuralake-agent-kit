<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" role="img" aria-labelledby="t d">
  <title id="t">Unofficial NeuraLake Agent Kit</title>
  <desc id="d">A glowing jellyfish above the project name</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b1026"/><stop offset="1" stop-color="#101a4a"/>
    </linearGradient>
    <radialGradient id="bell" cx="50%" cy="35%" r="70%">
      <stop offset="0" stop-color="#9fb4ff"/><stop offset="0.6" stop-color="#5b7bff"/><stop offset="1" stop-color="#3a4fd6"/>
    </radialGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="8"/></filter>
  </defs>
  <rect width="1200" height="400" fill="url(#bg)"/>
  <g fill="#cfd8ff" opacity=".55">
    <circle cx="90" cy="70" r="2"/><circle cx="210" cy="320" r="3"/><circle cx="420" cy="50" r="2"/>
    <circle cx="1100" cy="90" r="3"/><circle cx="980" cy="330" r="2"/><circle cx="800" cy="40" r="2"/>
  </g>
  <g transform="translate(250 40)">
    <ellipse cx="0" cy="80" rx="110" ry="80" fill="#5b7bff" opacity=".45" filter="url(#glow)"/>
    <g fill="none" stroke="#8fa6ff" stroke-width="6" stroke-linecap="round" opacity=".9">
      <path d="M-70 130 q-14 40 6 70 t-4 80"/>
      <path d="M-35 135 q-12 45 8 80 t-6 85"/>
      <path d="M0 138 q-10 50 10 85 t-4 95"/>
      <path d="M35 135 q12 45 -8 80 t6 85"/>
      <path d="M70 130 q14 40 -6 70 t4 80"/>
    </g>
    <path d="M-105 125 A105 105 0 0 1 105 125 Q80 108 52 126 Q26 108 0 126 Q-26 108 -52 126 Q-80 108 -105 125 Z" fill="url(#bell)"/>
    <ellipse cx="-34" cy="62" rx="34" ry="14" fill="#fff" opacity=".28" transform="rotate(-24 -34 62)"/>
  </g>
  <g font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" fill="#fff">
    <text x="470" y="170" font-size="64" font-weight="700">Unofficial NeuraLake</text>
    <text x="470" y="238" font-size="64" font-weight="700" fill="#9fb4ff">Agent Kit</text>
    <text x="470" y="292" font-size="24" fill="#cfd8ff">Teach any AI agent to use the NeuraLake API.</text>
    <text x="470" y="330" font-size="18" fill="#8fa0d8">Community project · not affiliated with NeuraLake · MIT</text>
  </g>
