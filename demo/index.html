<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Jelly — água-viva procedural</title>
<style>
:root{--bg:#0b1026;--bg2:#101a4a;--ink:#e8ecff;--mute:#8fa0d8;--chip:#1b2866}
@media (prefers-color-scheme:light){:root{--bg:#eef2ff;--bg2:#d9e1ff;--ink:#101a4a;--mute:#4a5aa8;--chip:#c4d0ff}}
*{box-sizing:border-box}html,body{min-height:100%;margin:0}
body{background:linear-gradient(var(--bg),var(--bg2));background-attachment:fixed;color:var(--ink);font:16px/1.4 -apple-system,"Segoe UI",Helvetica,Arial,sans-serif}
main{max-width:760px;margin:0 auto;padding:20px 16px 32px;text-align:center}
h1{font-size:20px;margin:0 0 4px}p{margin:0;color:var(--mute);font-size:14px}
#bot{width:min(78vw,340px);margin:12px auto calc(min(78vw,340px)*.3);overflow:visible;filter:drop-shadow(0 0 28px rgba(91,123,255,.55))}
h2{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--mute);margin:18px 0 8px}
.row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
button{background:var(--chip);color:var(--ink);border:0;border-radius:999px;padding:8px 14px;font:inherit;font-size:14px;cursor:pointer}
button[aria-pressed=true]{outline:2px solid #5b7bff}
#err{color:#ff8f8f;margin-top:12px}
footer{margin-top:24px;font-size:12px;color:var(--mute)}a{color:inherit}
</style></head><body><main>
<h1>🪼 Jelly</h1>
<p>Mexa o mouse ou toque: ela olha, pisca e reage. Motor: <a href="https://github.com/Jp-mainieri/procedural-bot-animations">procedural-bot-animations</a>.</p>
<div id="bot" role="img" aria-label="Água-viva animada"></div>
<h2>Humor</h2><div class="row" id="moods"></div>
<h2>Atividade</h2><div class="row" id="acts"></div>
<h2>Reações</h2><div class="row" id="reacts"></div>
<div id="err" role="alert"></div>
<footer>Personagem em <a href="jellyfish.character.json">jellyfish.character.json</a> (importável no Studio). Projeto não oficial, sem vínculo com a NeuraLake.</footer>
</main>
<script type="module">
import { mountCharacter, parseCharacter, MOODS, ACTIVITIES } from "https://cdn.jsdelivr.net/npm/procedural-bot-animations@0.2.0/+esm";
const $ = (id) => document.getElementById(id);
try {
  const parsed = parseCharacter(await (await fetch("jellyfish.character.json")).text());
  if (!parsed.ok) throw new Error(parsed.errors.join("\n"));
  const bot = mountCharacter($("bot"), { rig: parsed.value.rig, color: "#5b7bff", eyeColor: "#0b1026", label: "Jelly, a jellyfish" });
  const mk = (el, label, fn) => { const b = document.createElement("button"); b.textContent = label; b.onclick = () => fn(b); el.appendChild(b); return b; };
  const single = (el, items, apply, none) => {
    const btns = [];
    const set = (b, v) => { btns.forEach((x) => x.setAttribute("aria-pressed", x === b)); apply(v); };
    if (none) btns.push(mk(el, none, (b) => set(b, null)));
    for (const k of items) btns.push(mk(el, k, (b) => set(b, k)));
  };
  single($("moods"), Object.keys(MOODS), (m) => bot.update({ mood: m }));
  single($("acts"), Object.keys(ACTIVITIES), (a) => bot.update({ activity: a }), "nenhuma");
  for (const r of ["success","idea","wink","cheerful","shy","laugh","doubleHop","somersault","fright","dizzy"]) mk($("reacts"), r, () => bot.react(r));
} catch (e) { $("err").textContent = "Falha ao carregar: " + e.message; }
</script></body></html>
