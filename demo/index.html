<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Água-viva procedural</title>
<style>
:root{--bg:#0b1026;--bg2:#101a4a;--ink:#e8ecff;--mute:#8fa0d8;--chip:#1b2866}
@media (prefers-color-scheme:light){:root{--bg:#eef2ff;--bg2:#d9e1ff;--ink:#101a4a;--mute:#4a5aa8;--chip:#c4d0ff}}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:linear-gradient(var(--bg),var(--bg2));color:var(--ink);font:16px/1.4 -apple-system,"Segoe UI",Helvetica,Arial,sans-serif;display:flex;flex-direction:column;overflow:hidden}
header{padding:16px;text-align:center}h1{font-size:18px;margin:0 0 4px}p{margin:0;color:var(--mute);font-size:14px}
#stage{flex:1;position:relative;min-height:0;touch-action:none}svg{width:100%;height:100%;display:block}
nav{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;padding:12px 16px 16px}
button{background:var(--chip);color:var(--ink);border:0;border-radius:999px;padding:8px 14px;font:inherit;cursor:pointer}
button[aria-pressed=true]{outline:2px solid #5b7bff}
#dbg{position:absolute;left:12px;bottom:8px;font:12px ui-monospace,Menlo,monospace;color:var(--mute)}
</style></head><body>
<header><h1>🪼 Água-viva procedural</h1><p>Mova o mouse, toque ou clique para ela nadar. Sem bibliotecas: SVG + JS.</p></header>
<div id="stage"><svg viewBox="0 0 800 500" aria-label="Água-viva animada"><defs>
<radialGradient id="bg2" cx="50%" cy="35%" r="70%"><stop offset="0" stop-color="#9fb4ff"/><stop offset=".6" stop-color="#5b7bff"/><stop offset="1" stop-color="#3a4fd6"/></radialGradient>
<filter id="gl" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="10"/></filter></defs>
<g id="root"><g id="shadowless"><ellipse id="halo" cx="0" cy="40" rx="120" ry="90" fill="#5b7bff" opacity=".4" filter="url(#gl)"/>
<g id="tents" fill="none" stroke="#8fa6ff" stroke-width="6" stroke-linecap="round"></g>
<g id="bell"><path d="M-105 0 A105 105 0 0 1 105 0 Q80 -17 52 1 Q26 -17 0 1 Q-26 -17 -52 1 Q-80 -17 -105 0 Z" fill="url(#bg2)"/>
<ellipse cx="-34" cy="-63" rx="34" ry="14" fill="#fff" opacity=".28" transform="rotate(-24 -34 -63)"/></g></g></g></svg>
<div id="dbg"></div></div>
<nav id="moods" aria-label="Humor"></nav>
<script>
const clamp=(v,a,b)=>v<a?a:v>b?b:v, lerp=(a,b,t)=>a+(b-a)*t;
const damp=(c,t,r,dt)=>lerp(c,t,1-Math.exp(-r*dt));
const spring=(o,t,k,c,dt)=>{o.v+=(k*(t-o.a)-c*o.v)*dt;o.a+=o.v*dt};
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
const NS='http://www.w3.org/2000/svg',root=document.getElementById('root'),bell=document.getElementById('bell'),
 halo=document.getElementById('halo'),tg=document.getElementById('tents'),dbg=document.getElementById('dbg'),stage=document.getElementById('stage');
// humores: ritmo da natação, amplitude, rigidez das molas
const MOODS={calmo:{rate:.55,amp:.8,k:70,c:9,glow:.35},curioso:{rate:.8,amp:1,k:120,c:11,glow:.45},elétrico:{rate:1.25,amp:1.3,k:200,c:14,glow:.65}};
let mood='curioso',m={...MOODS.curioso};
const N=5,tents=[];
for(let i=0;i<N;i++){const p=document.createElementNS(NS,'path'),x=(i-2)*35,s=i%2?1:-1;
 p.setAttribute('d',`M${x} 4 q${-10*s} 40 ${8*s} 70 t${-4*s} 80`);tg.appendChild(p);
 tents.push({p,x,s,sp:{a:0,v:0},f1:.9+i*.31,f2:1.7+i*.23,ph:i*1.9});}
const moodsEl=document.getElementById('moods');
for(const k in MOODS){const b=document.createElement('button');b.textContent=k;b.setAttribute('aria-pressed',k===mood);
 b.onclick=()=>{mood=k;[...moodsEl.children].forEach(x=>x.setAttribute('aria-pressed',x===b))};moodsEl.appendChild(b)}
const pos={x:400,y:230},vel={x:0,y:0},target={x:400,y:230};let pulseT=0,jet=0,lastMove=0,t=0,hasPointer=false;
const sq={a:0,v:0};
function toSvg(e){const r=stage.getBoundingClientRect(),sc=Math.min(r.width/800,r.height/500);
 return{x:(e.clientX-r.left-(r.width-800*sc)/2)/sc,y:(e.clientY-r.top-(r.height-500*sc)/2)/sc}}
stage.addEventListener('pointermove',e=>{const p=toSvg(e);target.x=clamp(p.x,120,680);target.y=clamp(p.y,120,330);lastMove=t;hasPointer=true});
stage.addEventListener('pointerdown',e=>{const p=toSvg(e);target.x=clamp(p.x,120,680);target.y=clamp(p.y,120,330);jet=1;pulseT=0;lastMove=t});
let last=performance.now();
function frame(now){const dt=Math.min(.05,(now-last)/1000);last=now;t+=dt;
 // vagueia quando o cursor está parado
 if(t-lastMove>2.5||!hasPointer){const w=t*.0;if(!frame.next||t>frame.next){target.x=clamp(400+(Math.random()-.5)*420,120,680);target.y=clamp(230+(Math.random()-.5)*160,120,330);frame.next=t+1.5+Math.random()*2.5}}
 // ciclo de natação: contrai (jato) e relaxa; nunca igual
 pulseT+=dt*m.rate*(1+.25*Math.sin(t*.7)); const cyc=pulseT%1, contract=Math.exp(-Math.pow((cyc-.18)/.12,2));
 if(cyc<.05&&!frame.fired){frame.fired=1;jet=Math.max(jet,1)} if(cyc>.2)frame.fired=0;
 // jato empurra em direção ao alvo; arrasto devolve a velocidade a ~0
 const dx=target.x-pos.x,dy=target.y-pos.y,d=Math.hypot(dx,dy)||1;
 if(jet>0){const f=900*jet*m.amp*dt;vel.x+=dx/d*f*.6;vel.y+=dy/d*f*.6;jet=Math.max(0,jet-dt*3)}
 vel.y+=14*dt; vel.x*=Math.exp(-1.6*dt);vel.y*=Math.exp(-1.6*dt);
 vel.y+= -4*Math.sin(t*1.3)*dt*10;
 pos.x+=vel.x*dt;pos.y+=vel.y*dt;pos.x=clamp(pos.x,100,700);pos.y=clamp(pos.y,110,340);
 const sp=Math.hypot(vel.x,vel.y);
 // sino: contração aperta e estica; relaxa alarga (squash & stretch)
 spring(sq,contract,320,15,dt);
 const sx=1-.1*sq.a*m.amp+.04*(1-contract)*0, sy=1+.1*sq.a*m.amp;
 const tilt=clamp(vel.x*.045,-16,16);
 const breathe=reduce?0:Math.sin(t*1.65)*.012;
 root.setAttribute('transform',`translate(${pos.x.toFixed(1)} ${pos.y.toFixed(1)}) rotate(${(reduce?0:tilt).toFixed(2)})`);
 bell.setAttribute('transform',`scale(${(sx*(1-breathe)).toFixed(4)} ${(sy*(1+breathe)).toFixed(4)})`);
 halo.setAttribute('opacity',(m.glow*(.8+.2*Math.sin(t*2))).toFixed(3));
 for(const o of tents){
  // alvo da mola: oposto à velocidade (arrasto) + dois senos fora de fase
  const idle=Math.sin(t*o.f1+o.ph)*4+Math.sin(t*o.f2+o.ph*1.7)*2.2;
  const drag=clamp(-vel.x*.05,-24,24)*o.s*.0+clamp(-vel.x*.06,-26,26);
  spring(o.sp,(reduce?0:idle*m.amp)+drag,m.k,m.c,dt);
  const stretch=1+clamp(vel.y*-.0006,-.08,.1)+.08*contract;
  o.p.setAttribute('transform',`translate(${o.x} 4) rotate(${o.sp.a.toFixed(2)}) scale(1 ${stretch.toFixed(3)}) translate(${-o.x} -4)`);}
 dbg.textContent=`humor: ${mood} · vel ${sp.toFixed(0)} · ciclo ${(cyc*100|0)}%`;
 requestAnimationFrame(frame)}
setInterval(()=>{for(const k in m)m[k]=damp(m[k],MOODS[mood][k],1,.1)},100);
requestAnimationFrame(frame);
</script></body></html>
